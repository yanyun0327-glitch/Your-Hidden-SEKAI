const CODES=['Q','C','G','P','B','O','H','V'], MCODES=['U','I','D','R'];
const TRAIT_NAMES={Q:'沉靜內斂',C:'溫柔關懷',G:'目標與毅力',P:'活潑趣味',B:'勇敢表達',O:'想像創造',H:'關係羈絆',V:'內在感受',U:'活力節奏',I:'情緒張力',D:'幻想變化',R:'內省餘韻'};

function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeLoad(){try{const data=JSON.parse(localStorage.getItem(KEY)); if(data&&typeof data==='object'&&data.answers){const a={};for(const q of DB.questions){const k=data.answers[q.id];if(q.options.some(x=>x.id===k))a[q.id]=k}state.answers=a;state.index=Math.max(0,Math.min(17,Number(data.index)||0));if(data.result&&Object.keys(a).length===18)state.result=compute(a)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers:state.answers,index:state.index,result:state.result?true:null}))}catch(e){}}
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.add('hide'),2800)}

function home(){const count=Object.keys(state.answers).length;return `<section class="hero"><div class="kicker">A journey beyond the ordinary</div><div class="moon" aria-hidden="true">☾ ✧</div><h1>你的 SEKAI<br>藏著誰？</h1><p>18 個看似平凡的日常選擇，<br>找到與你共鳴的角色、音樂團體與命定歌曲。</p><div class="buttonline"><button class="btn" data-action="start">✦ ${count>0&&count<18?'繼續測驗':'開始尋找你的 SEKAI'} →</button>${state.result?'<button class="btn secondary" data-action="last">查看上次結果</button>':''}</div><div class="feature-grid"><div class="feature"><span class="ficon">✉</span><strong>18 道隱藏題目</strong><small>沒有標準答案</small></div><div class="feature"><span class="ficon">♡</span><strong>20 位原創角色</strong><small>找到命定推角</small></div><div class="feature"><span class="ficon">♫</span><strong>60 首歌曲</strong><small>跨團體獨立推薦</small></div></div><p class="notice">約需 4～6 分鐘 · 可暫停後繼續 · 無需登入</p></section>`}
function quiz(){const q=DB.questions[state.index],sel=state.answers[q.id];return `<section class="section"><div class="quiz-head"><span class="kicker">THE QUIET QUESTIONS</span><span class="muted mini">${String(state.index+1).padStart(2,'0')} / 18</span></div><div class="progress"><div class="progress-inner" style="width:${(state.index+1)/18*100}%"></div></div><div class="question-box"><span class="muted mini">QUESTION ${String(state.index+1).padStart(2,'0')}</span><h2>${esc(q.text)}</h2><div class="options">${q.options.map((o,i)=>`<button data-answer="${o.id}" class="option ${sel===o.id?'selected':''}" aria-pressed="${sel===o.id}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div class="quiz-nav"><button class="btn ghost" data-action="prev">← ${state.index?'上一題':'首頁'}</button><button class="btn" data-action="next" ${!sel?'disabled':''}>${state.index===17?'揭曉我的 SEKAI ✦':'下一題 →'}</button></div></div><p class="notice" style="text-align:center;margin-top:18px">跟著直覺選擇即可。沒有對錯，也不必刻意分析。</p></section>`}
function maxPerDimension(start,end,key,codes){const max=Object.fromEntries(codes.map(k=>[k,0]));for(let i=start;i<end;i++){for(const k of codes){max[k]+=Math.max(...DB.questions[i].options.map(o=>(o[key]||{})[k]||0))}}return max}
const MAX_SELF=maxPerDimension(0,6,'self',CODES),MAX_APPEAL=maxPerDimension(6,12,'appeal',CODES),MAX_M1=maxPerDimension(0,6,'music',MCODES),MAX_M2=maxPerDimension(12,18,'music',MCODES);
function accumulate(answers,start,end,key,codes){const result=Object.fromEntries(codes.map(k=>[k,0]));for(let i=start;i<end;i++){let q=DB.questions[i],opt=q.options.find(o=>o.id===answers[q.id]);if(!opt)continue;for(const [k,v] of Object.entries(opt[key]||{}))result[k]+=v}return result}
function normalized(raw,max,codes){return Object.fromEntries(codes.map(k=>[k,max[k]?raw[k]/max[k]:0]))}
function weighted(profile,weights){return Object.entries(weights).reduce((total,[k,v])=>total+(profile[k]||0)*v,0)/10}
function compute(answers){if(DB.questions.some(q=>!q.options.some(o=>o.id===answers[q.id])))return null;
let self=normalized(accumulate(answers,0,6,'self',CODES),MAX_SELF,CODES), appeal=normalized(accumulate(answers,6,12,'appeal',CODES),MAX_APPEAL,CODES);
let m1=normalized(accumulate(answers,0,6,'music',MCODES),MAX_M1,MCODES),m2=normalized(accumulate(answers,12,18,'music',MCODES),MAX_M2,MCODES);
let music=Object.fromEntries(MCODES.map(k=>[k,5*(.3*m1[k]+.7*m2[k])]));
let characters=DB.characters.map(c=>({...c,score:.5*weighted(self,c.self)+.5*weighted(appeal,c.appeal)})).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id,undefined,{numeric:true}));
let meanP=MCODES.reduce((a,k)=>a+music[k],0)/4;
let normP=Math.sqrt(MCODES.reduce((a,k)=>a+(music[k]-meanP)**2,0));
let songs=DB.songs.map(s=>{let meanS=MCODES.reduce((a,k)=>a+s.m[k],0)/4;let normS=Math.sqrt(MCODES.reduce((a,k)=>a+(s.m[k]-meanS)**2,0));let dot=MCODES.reduce((a,k)=>a+(music[k]-meanP)*(s.m[k]-meanS),0);let similarity=normP>1e-8&&normS>1e-8?dot/(normP*normS):0;let distance=MCODES.reduce((a,k)=>a+Math.abs(music[k]-s.m[k]),0)/20;return {...s,score:Math.max(0,Math.min(1,.65*(similarity+1)/2+.35*(1-distance)))}}).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id,undefined,{numeric:true}));
let units=DB.units.map((u,i)=>{let top=songs.filter(s=>s.unit===i).slice(0,4);return {...u,id:i,score:top.reduce((a,s)=>a+s.score,0)/4}}).sort((a,b)=>b.score-a.score||a.id-b.id);
return {characters,units,songs,self,appeal,music}}
function traitContributions(c,res){const contributions=CODES.map(k=>({k,v:.5*(res.self[k]*(c.self[k]||0)/10+res.appeal[k]*(c.appeal[k]||0)/10)})).sort((a,b)=>b.v-a.v);return contributions.slice(0,3).map(x=>x.k)}
function characterReason(c,res){let x=traitContributions(c,res).slice(0,2),label=x.map(k=>TRAIT_NAMES[k]).join('與');return `你的回答透露出對「${label}」的共鳴。${c.description}`}
function songReason(s,res){const strongest=MCODES.map(k=>({k,v:5-Math.abs(res.music[k]-s.m[k])})).sort((a,b)=>b.v-a.v).slice(0,2);return `你對${strongest.map(x=>TRAIT_NAMES[x.k]).join('、')}的偏好，與這首歌的特徵較為接近。`}

function result(){const r=state.result;if(!r)return home();const top=r.characters.slice(0,3),songTop=r.songs.slice(0,5);return `<section class="result-hero"><div class="kicker">YOUR SEKAI HAS AWAKENED</div><h1>你的共鳴報告 ✧</h1><p class="muted">有些相遇，藏在最平凡的選擇裡。</p></section><div class="result-head"><span class="num">01 /</span><h2>你會為誰停下腳步？</h2></div><div class="cards">${top.map((c,i)=>`<article class="card ${i===0?'lead':''}">${avatar(c)}<span class="rank">${i===0?'✦ 命定推角':`TOP ${i+1}`}</span><h3>${esc(c.name)}</h3><span class="tag" style="color:${DB.units[c.unit].color}">${esc(DB.units[c.unit].name)}</span><p>${esc(characterReason(c,r))}</p><p class="bio-text"><strong>人物性格與故事：</strong>${esc(CHARACTER_BIOS[c.name]||c.description)}</p><div class="profile-link">${officialCharacterLink(c)}</div><div class="traits">${traitContributions(c,r).map(k=>`<span>${TRAIT_NAMES[k]}</span>`).join('')}</div></article>`).join('')}</div><p class="notice">排名由性格相似度 50% ＋ 欣賞偏好 50% 計算，並不代表科學機率。</p><div class="result-head"><span class="num">02 /</span><h2>你的耳朵會愛上哪個世界？</h2></div><div class="ranklist">${r.units.map((u,i)=>`<article class="unit-row"><span class="unit-symbol" style="background:${u.color}2a;color:${u.color}">${u.symbol}</span><div class="unit-detail"><div class="unit-line"><strong>${i+1}. ${esc(u.name)}</strong><span class="muted mini">契合 ${Math.round(u.score*100)} / 100</span></div><div class="meter"><span style="width:${Math.round(u.score*100)}%;background:${u.color}"></span></div><div class="mini muted" style="margin-top:6px">${esc(u.description)}</div></div></article>`).join('')}</div><p class="notice">以各團最高分四首歌曲的平均匹配值排名，與推角結果分開計算。</p><div class="result-head"><span class="num">03 /</span><h2>有一首歌，正在等你遇見。</h2></div><article class="song-main"><div class="record" aria-hidden="true">♫</div><div><span class="kicker">YOUR DESTINED SONG</span><h3>${esc(songTop[0].title)}</h3><span class="tag" style="color:${DB.units[songTop[0].unit].color}">${esc(DB.units[songTop[0].unit].name)}</span function songLink(s){if(OFFICIAL_VIDEOS[s.title])return `<a class="listen" href="https://www.youtube.com/watch?v=${OFFICIAL_VIDEOS[s.title]}" target="_blank" rel="noopener noreferrer">官方 MV ↗</a>`;if(s.officialUrl)return `<a class="listen" href="${esc(s.officialUrl)}" target="_blank" rel="noopener noreferrer">官方聆聽 ↗</a>`;return `<a class="listen" href="${esc(officialSearch(s))}" target="_blank" rel="noopener noreferrer">搜尋官方 MV ↗</a>`}

function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();notify(ok?'結果已複製 ✦':'複製失敗，請手動選取文字')}
function exportImage(){const r=state.result;if(!r)return;const cv=document.createElement('canvas');cv.width=900;cv.height=1500;const c=cv.getContext('2d');const bg=c.createLinearGradient(0,0,900,1500);bg.addColorStop(0,'#262448');bg.addColorStop(1,'#10192f');c.fillStyle=bg;c.fillRect(0,0,900,1500);for(let i=0;i<100;i++){const x=(i*293+53)%900,y=(i*563+79)%1500;c.fillStyle=`rgba(236,225,255,${.25+(i%5)*.1})`;c.beginPath();c.arc(x,y,i%9===0?3:1.5,0,7);c.fill()}

root.addEventListener('click',event=>{const play=event.target.closest('[data-play]');if(play){const title=play.dataset.play;const song=state.result?.songs.find(s=>s.title===title);const box=document.querySelector('.video-section');if(song&&box){box.innerHTML='<h3>♫ '+esc(song.title)+'</h3>'+videoPlayer(song);box.scrollIntoView({behavior:'smooth',block:'center'})}return}const answer=event.target.closest('[data-answer]');if(answer){state.answers[DB.questions[state.index].id]=answer.dataset.answer;state.result=null;save();render();return}const btn=event.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case 'start':if(Object.keys(state.answers).length===18){state.answers={};state.index=0;state.result=null;save()}changeScreen('quiz');break;case 'prev':if(state.index){state.index--;save();changeScreen('quiz')}else changeScreen('home');break;case 'next':if(!state.answers[DB.questions[state.index].id])return;if(state.index===17){finish()}else{state.index++;save();changeScreen('quiz')}break;case 'skip':clearTimeout(revealTimer);changeScreen('result');break;case 'last':changeScreen('result');break;case 'restart':restart();break;case 'copy':copyResult();break;case 'export':exportImage();break}});
